name: Apply D1 migrations (one-off)

# Temporary: applies migration 0021 (prep_reviews) to the remote D1. Removed in the next commit.
on:
  push:
    branches: [claude/laughing-goodall-blec68]
    paths: [".github/workflows/migrate-once.yml"]

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: List pending migrations
        run: npx wrangler d1 migrations list job-search-os --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply
        run: npx wrangler d1 migrations apply job-search-os --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
