name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  crawler:
    name: Crawler (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r crawler/requirements.txt
      - name: Lint
        run: ruff check crawler scripts mcp
      - name: Tests
        run: pytest crawler/tests -q

  secrets:
    name: No credentials or personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A referral contact's phone number once reached a test fixture. It was spotted by an
      # ad-hoc grep that printed a warning and let the commit through, which is worse than no
      # check at all -- it manufactures confidence. This one fails the build.
      - name: Scan tracked files
        run: python scripts/check_no_secrets.py
