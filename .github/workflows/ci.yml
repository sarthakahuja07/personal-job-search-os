name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  crawler:
    name: Crawler (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r crawler/requirements.txt
      - name: Lint
        run: ruff check crawler
      - name: Tests
        run: pytest crawler/tests -q
